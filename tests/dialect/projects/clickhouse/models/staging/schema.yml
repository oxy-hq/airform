version: 2

sources:
  - name: raw
    tables:
      - name: raw_users
        columns:
          - name: id
            data_type: integer
          - name: first_name
            data_type: varchar
          - name: last_name
            data_type: varchar
          - name: email
            data_type: varchar
          - name: country
            data_type: varchar
          - name: revenue
            data_type: float
      - name: raw_orders
        columns:
          - name: id
            data_type: integer
          - name: user_id
            data_type: integer
          - name: amount
            data_type: float
          - name: status
            data_type: varchar
