version: 2

models:
  - name: int_user_accounts
    description: Users joined with their account information.
    config:
      materialized: ephemeral
    columns:
      - name: user_id
  - name: int_user_subscriptions
    description: Users with their current subscription details.
    columns:
      - name: user_id
        tests: [not_null]
  - name: int_account_subscriptions
    description: Accounts with subscription history.
    columns:
      - name: subscription_id
        tests: [not_null, unique]
  - name: int_invoice_payments
    description: Invoices joined with payment details.
    config:
      materialized: ephemeral
    columns:
      - name: invoice_id
  - name: int_user_sessions
    description: User session aggregates.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_session_events
    description: Sessions enriched with event counts.
    config:
      materialized: ephemeral
    columns:
      - name: session_id
  - name: int_user_events
    description: User-level event aggregates.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_user_page_views
    description: User page view aggregates.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_account_revenue
    description: Account-level revenue calculations.
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: int_user_feature_usage
    description: User feature usage aggregates.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_account_tickets
    description: Account-level ticket aggregates.
    config:
      materialized: ephemeral
    columns:
      - name: account_id
  - name: int_user_engagement_scores
    description: Calculated engagement scores per user.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_subscription_mrr
    description: Monthly recurring revenue per subscription.
    columns:
      - name: subscription_id
        tests: [not_null, unique]
  - name: int_user_first_events
    description: First event timestamps per user.
    config:
      materialized: ephemeral
    columns:
      - name: user_id
  - name: int_account_health
    description: Account health score calculation.
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: int_user_activity_summary
    description: Summary of user activity across all dimensions.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_payment_success_rates
    description: Payment success rate by account.
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: int_session_page_views
    description: Page views aggregated per session.
    columns:
      - name: session_id
        tests: [not_null, unique]
  - name: int_ticket_resolution
    description: Ticket resolution metrics.
    columns:
      - name: ticket_id
        tests: [not_null, unique]
  - name: int_feature_adoption
    description: Feature adoption by user count.
    columns:
      - name: feature_name
        tests: [not_null, unique]
  - name: int_daily_events
    description: Daily event counts per user.
    columns:
      - name: user_id
        tests: [not_null]
  - name: int_revenue_by_plan
    description: Revenue aggregated by plan.
    columns:
      - name: plan_id
        tests: [not_null, unique]
  - name: int_user_signup_cohorts
    description: Users grouped into signup cohorts by month.
    columns:
      - name: user_id
        tests: [not_null, unique]
  - name: int_account_user_counts
    description: Count of users per account.
    columns:
      - name: account_id
        tests: [not_null, unique]
  - name: int_ticket_agent_metrics
    description: Support agent performance metrics.
    columns:
      - name: agent_id
        tests: [not_null, unique]
