version: 2

models:
  - name: customers
    description: >
      Customer-level table with lifetime order summary metrics.
      One row per customer.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last name.
      - name: first_order
        description: Date of the customer's first order.
      - name: most_recent_order
        description: Date of the customer's most recent order.
      - name: number_of_orders
        description: Total number of orders placed by the customer.
      - name: customer_lifetime_value
        description: Total amount spent by the customer across all orders (in dollars).

  - name: orders
    description: >
      Order-level table with payment breakdown by method.
      One row per order.
    columns:
      - name: order_id
        description: Primary key.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Foreign key to the customers table.
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        description: Date the order was placed.
      - name: status
        description: Current status of the order.
        tests:
          - accepted_values:
              values: ["placed", "shipped", "completed", "return_pending", "returned"]
      - name: amount
        description: Total payment amount for this order (in dollars).
